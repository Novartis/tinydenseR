# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs test coverage analysis using covr and uploads results to Codecov.
# Triggered on push to main branch and pull requests.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly run keeps the dependency cache alive: GitHub evicts caches after
    # 7 days without a read, and pushes here are often weeks apart.
    # NOTE: GitHub suspends cron triggers after 60 days of repo inactivity.
    - cron: '0 6 * * 1'

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # A cold dependency install alone has taken 23 min; covr instrumentation
    # makes the test run several times slower than plain testthat.
    timeout-minutes: 90
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # BPCells stays excluded here so the reported coverage % is comparable
          # across runs; the BPCells paths are exercised by R-CMD-check instead.
          extra-packages: any::covr, any::xml2, BPCells=?ignore
          needs: coverage
          cache-version: 1

      - name: Run test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(tempdir(), winslash = "/"), "package")
          )
          print(cov)
          cat("Coverage: ", covr::percent_coverage(cov), "%\n", sep = "")
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          # A Codecov outage should not be reported as a package failure.
          fail_ci_if_error: false
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
